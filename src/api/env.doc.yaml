# ============================================
# Configuration Notes
# ============================================
#
# 1. YAML Syntax:
#    - Use spaces for indentation (not tabs)
#    - Lists use "- " prefix
#    - Multi-line strings use "|" for literal block or ">" for folded block
#
# 2. Optional Sections:
#    - All sections are optional except models (at least one model required)
#    - Omitted sections will use default values or environment variables
#
# 3. Model Configuration:
#    - At least one model must be configured (local or remote)
#    - Multiple models can be configured in the same file
#    - Each model can have different completion_params and serving_params
#
# 4. Environment Variable Override:
#    - Environment variables can override YAML values
#    - Priority: env.yaml > environment variables > defaults
#    - Use environment variables for sensitive data (API keys) or deployment-specific values
#
# 5. Custom Parameters:
#    - Both completion_params and serving_params support custom_params
#    - Any unrecognized parameters will be stored in custom_params
#    - Useful for model-specific parameters not in the standard schema
#
# 6. Tokenizer Configuration:
#    - Tokenizer is required for document processing with token counting
#    - Set tokenizer in model config or documents.tokenizer_model
#    - If not set, system will use first available tokenizer
#
# 7. Serving Parameters:
#    - Only applicable to local_models
#    - Controls llama-server behavior
#    - See llama-cpp-python documentation for full parameter list
#
# ============================================

