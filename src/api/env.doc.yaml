# ============================================
# KVCache Chatbot API - YAML Configuration Documentation
# ============================================
# This file documents all available configuration options in env.yaml
#
# Configuration file location: src/api/env.yaml
#
# Configuration Priority:
#   1. env.yaml (highest priority)
#   2. Environment variables / .env file
#   3. Code default values (lowest priority)
# ============================================

# ============================================
# API Settings (api:)
# ============================================
# General API configuration settings
# Can also be configured via environment variables with API_ prefix

api:
  # API title displayed in documentation (default: "KVCache Chatbot API")
  title: KVCache Chatbot API

  # API version (default: "1.0.0")
  version: 1.0.0

  # API route prefix (default: "/api/v1")
  prefix: /api/v1

  # Session timeout in seconds (default: 3600 = 1 hour)
  session_timeout: 3600

# ============================================
# Server Settings (server:)
# ============================================
# Server configuration for llama-server executable
# Can also be configured via environment variables with SERVER_ prefix

server:
  # Absolute path to llama-server.exe executable
  # Required for local model deployment
  exe_path: /absolute/path/to/llama-server.exe

  # Absolute path to server log file
  # Logs from llama-server will be written here
  log_path: /absolute/path/to/server.log

  # Cache directory path (e.g., R:\ for Windows)
  # Used for KV cache storage
  cache_dir: R:\

# ============================================
# Models Configuration (models:)
# ============================================
# Model configuration supports both local and remote models
# Structure: models.local_models[] and models.remote_models[]

models:
  # ============================================
  # Local Models (models.local_models:)
  # ============================================
  # Self-hosted models running via llama-server
  # Each model is configured as a list item

  local_models:
    # Example local model configuration
    - model_name_or_path: /absolute/path/to/model.gguf
      # Display name for the model (defaults to model_name_or_path if not set)
      # Set to null to use model_name_or_path as serving name
      serving_name: my-local-model

      # HuggingFace tokenizer identifier (e.g., meta-llama/Llama-3.1-8B-Instruct)
      # Used for token counting in document processing
      tokenizer: meta-llama/Llama-3.1-8B-Instruct

      # Base URL for OpenAI-compatible API endpoint
      # Usually: http://localhost:13141/v1
      base_url: http://localhost:13141/v1

      # API key (use "not-needed" for local models)
      api_key: not-needed

      # ============================================
      # Completion Parameters (completion_params:)
      # ============================================
      # Text generation parameters for this model

      completion_params:
        # Basic generation parameters
        # Temperature for text generation (default: 0.7, range: 0.0-2.0)
        # Higher values = more creative, lower values = more focused
        temperature: 0.7

        # Maximum tokens to generate (default: 2000)
        max_tokens: 2000

        # Optional: Additional completion parameters
        # These can be added as custom parameters:
        # top_p: 0.95          # Nucleus sampling
        # top_k: 40             # Top-k sampling
        # repeat_penalty: 1.1   # Repetition penalty
        # frequency_penalty: 0.0
        # presence_penalty: 0.0

        # Custom parameters (for model-specific parameters)
        # Any additional parameters will be passed to the LLM API
        # custom_params:
        #   repeat_last_n: 64
        #   penalize_newline: true
        #   chat_template_kwargs:
        #     reasoning_effort: low

      # ============================================
      # Serving Parameters (serving_params:)
      # ============================================
      # Llamacpp serving arguments (only for local models)
      # These parameters control how llama-server runs the model
      # More details: https://llama-cpp-python.readthedocs.io/en/latest/api-reference/

      serving_params:
        # Random seed (default: 0)
        seed: 0

        # Server port (default: 13141)
        port: 13141

        # Server host (default: "0.0.0.0")
        host: 0.0.0.0

        # Context size / Maximum context length (default: 16384)
        ctx_size: 16384

        # Main GPU device ID (default: 0)
        main_gpu: 0

        # Parallel processing count (default: 1)
        parallel: 1

        # Number of GPU layers to offload (default: 100)
        n_gpu_layers: 100

        # Log verbosity level (default: 9)
        log_verbosity: 9

        # SSD KV offload size in GB (default: 100)
        ssd_kv_offload_gb: 100

        # DRAM KV offload size in GB (default: 0)
        dram_kv_offload_gb: 0

        # Optional: Additional serving parameters
        # These can be added as custom parameters:
        # reasoning_format: deepseek  # For reasoning models
        # jinja: true                 # Enable Jinja templates
        # swa_full: true              # Sliding window attention
        # n_ubatch: 512
        # n_batch: 512
        # n_parallel: 1
        # n_ctx: 2048

    # Example: Second local model (minimal configuration)
    - model_name_or_path: /path/to/another/model.gguf
      # Using null means serving_name will be set to model_name_or_path
      serving_name: null
      tokenizer: meta-llama/Llama-3.1-8B-Instruct
      base_url: http://localhost:13141/v1
      api_key: not-needed
      completion_params:
        temperature: 0.0
        max_tokens: 20000

  # ============================================
  # Remote Models (models.remote_models:)
  # ============================================
  # External models via cloud APIs or other servers
  # Each model is configured as a list item

  remote_models:
    # Example: OpenAI API
    - provider: openai  # Current version only supports OpenAI-compatible APIs
      # Model identifier (e.g., "gpt-4o-mini", "gpt-4", "gpt-3.5-turbo")
      model: gpt-4o-mini

      # Display name for the model (defaults to model if not set)
      serving_name: gpt-4o-mini

      # HuggingFace tokenizer identifier (optional, can be null)
      tokenizer: null

      # Base URL for API endpoint
      base_url: https://api.openai.com/v1

      # API key (required for remote models)
      api_key: YOUR_OPENAI_API_KEY

      # Completion parameters
      completion_params:
        temperature: 0.7
        max_tokens: 4000

    # Example: Google Gemini (OpenAI-compatible endpoint)
    - provider: openai  # Use "openai" for OpenAI-compatible APIs
      model: gemini-2.0-flash
      serving_name: gemini-2.0-flash
      tokenizer: null
      # Note: Use the OpenAI-compatible path provided by Google
      base_url: https://generativelanguage.googleapis.com/v1beta/openai/
      api_key: YOUR_GOOGLE_GEMINI_API_KEY
      completion_params:
        temperature: 0.5
        max_tokens: 8000

# ============================================
# Document Settings (documents:)
# ============================================
# Document management and processing settings
# Can also be configured via environment variables with DOCUMENT_ prefix

documents:
  # Upload directory for document files (default: "uploads")
  upload_dir: uploads

  # Maximum file size in bytes (default: 52428800 = 50MB)
  max_file_size: 52428800

  # Allowed file extensions (list)
  # Default: [".pdf"]
  allowed_extensions:
    - .pdf

  # ============================================
  # Chunking Settings
  # ============================================
  # Settings for splitting documents into chunks

  # Maximum characters per chunk (default: 10000)
  chunk_size: 10000

  # Overlap between chunks for context continuity (default: 200)
  chunk_overlap: 200

  # ============================================
  # Tokenizer Settings
  # ============================================
  # Specify which model's tokenizer to use for token counting
  # Should match a serving_name or model_name_or_path from models config
  # If not set, will automatically use the first model with a tokenizer configured
  tokenizer_model: my-local-model  # Optional

  # ============================================
  # First-stage Grouping Settings
  # ============================================
  # Token-based sequential merging of chunks

  # Enable token-based grouping when tokenizer available (default: true)
  grouping: true

  # Maximum tokens per merged group (default: 40000)
  file_max_tokens: 40000

  # Minimum utilization for final group, range 0.0-1.0 (default: 0.8)
  # Groups below this threshold will be merged with previous group
  utilization_threshold: 0.8

  # ============================================
  # Stage-2 Similarity Grouping Settings
  # ============================================
  # Similarity-based grouping of chunks

  # Similarity method: "bm25" or "embedding" (default: "bm25")
  similarity_method: bm25

  # Optional BM25 threshold score (default: null)
  # Only chunks with similarity score above this threshold will be grouped
  similarity_min_score: 0.5  # Optional

# ============================================
# Prompts Settings (prompts:)
# ============================================
# Prompt template settings for RAG and document context
# Can also be configured via environment variables with PROMPTS_ prefix
# Note: Multi-line strings are better configured in YAML than in .env

prompts:
  # System prompt template
  # Used to instruct the model on how to respond with document context
  # Placeholder: {doc_context} will be replaced with retrieved document chunks
  system_prompt_template: |
    ### Task:
    Respond to the user query using the provided context.

    ### Guidelines:
    - If you don't know the answer, clearly state that.
    - Respond in the same language as the user's query.

    ### Output:
    Provide a clear and direct response to the user's query.

    <context>
    {doc_context}
    </context>

  # User prompt template
  # Used to format the user's query
  # Placeholder: {user_query} will be replaced with the actual user query
  user_prompt_template: |
    <user_query>
    {user_query}
    </user_query>

